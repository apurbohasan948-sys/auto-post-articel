[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify Scheduled Functions (cron trigger for autonomous content agent cycle)
# Runs every 4 hours or customizable via Netlify dashboard
[functions."scheduler"]
  schedule = "0 */4 * * *"

# API Routes redirected to Netlify serverless functions
# Specific function endpoints first with force = true
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/providers/test"
  to = "/.netlify/functions/providers-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/providers/ai/test"
  to = "/.netlify/functions/providers-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/search/test"
  to = "/.netlify/functions/search-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/providers/search/test"
  to = "/.netlify/functions/search-test"
  status = 200
  force = true

# General API router for all other /api/* endpoints
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA routing fallback for Vite React client (runs ONLY when no earlier redirect matched)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
